<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Estructura · Temas 17–31 · TOEFL ITP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* ── LIGHT PALETTE (misma del index) ─────────────── */
      --bg:        #EAF2F0;
      --surface:   #FFFFFF;
      --surface-2: #F3F8F6;
      --ink:       #0D3B3A;
      --teal:      #12A594;
      --teal-d:    #0A7468;
      --teal-soft: #D8EFEB;
      --coral:     #FF7A5C;
      --coral-d:   #E85E3F;
      --amber:     #F6B24B;
      --blue:      #2FB6C6;
      --text:      #143230;
      --muted:     #64827F;
      --line:      #DFEBE8;
      --shadow:    rgba(13,59,58,.09);
      --shadow-lg: rgba(13,59,58,.14);

      --font-display: 'Bricolage Grotesque', 'Plus Jakarta Sans', sans-serif;
      --font-body:    'Plus Jakarta Sans', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    ::selection { background: var(--teal-soft); color: var(--ink); }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 46px 18px 56px;
    }

    /* ── HEADER ─────────────────────────────────────────── */
    .eyebrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .22em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .eyebrow::before, .eyebrow::after {
      content: "";
      height: 1px;
      width: 46px;
      background: linear-gradient(90deg, transparent, var(--line));
    }
    .eyebrow::after { background: linear-gradient(90deg, var(--line), transparent); }

    .head-title {
      font-family: var(--font-display);
      font-size: clamp(1.9rem, 7vw, 2.65rem);
      font-weight: 800;
      color: var(--ink);
      text-align: center;
      line-height: 1.08;
      letter-spacing: -.01em;
    }
    .head-title em { color: var(--teal); font-style: normal; }

    .head-sub {
      max-width: 460px;
      margin: 16px auto 0;
      text-align: center;
      font-size: .9rem;
      line-height: 1.6;
      color: var(--muted);
      font-weight: 500;
    }

    .head-count {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }
    .count-chip {
      font-size: .66rem;
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--teal-d);
      background: var(--teal-soft);
      border: 1px solid rgba(18,165,148,.25);
      padding: 6px 14px;
      border-radius: 20px;
    }

    /* ── CARD LIST ──────────────────────────────────────── */
    .topic-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 34px;
    }

    .topic-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 15px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 18px 16px 22px;
      cursor: pointer;
      overflow: hidden;
      transition: transform .15s ease, box-shadow .22s ease, border-color .22s ease;
      -webkit-tap-highlight-color: transparent;
    }
    /* barra de acento a la izquierda */
    .topic-card::before {
      content: "";
      position: absolute;
      left: 0; top: 12px; bottom: 12px;
      width: 5px;
      border-radius: 0 5px 5px 0;
      background: var(--accent, var(--teal));
    }
    .topic-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px var(--shadow);
      border-color: var(--accent, var(--teal));
    }
    .topic-card:active { transform: scale(.99); }

    .t-num {
      flex-shrink: 0;
      font-family: var(--font-display);
      font-size: .82rem;
      font-weight: 700;
      color: var(--muted);
      width: 20px;
      text-align: center;
    }

    .t-icon {
      flex-shrink: 0;
      width: 46px; height: 46px;
      border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      background: var(--accent-soft, var(--teal-soft));
      color: var(--accent, var(--teal));
    }
    .t-icon svg { width: 22px; height: 22px; }

    .t-body { flex: 1; min-width: 0; }
    .t-body h3 {
      font-family: var(--font-display);
      font-size: .96rem;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.35;
      display: inline;
    }
    .t-body .t-desc {
      font-family: var(--font-body);
      font-size: .82rem;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.5;
    }
    .t-es {
      display: block;
      font-size: .64rem;
      font-weight: 600;
      letter-spacing: .02em;
      color: var(--accent, var(--teal-d));
      margin-top: 5px;
      text-transform: uppercase;
    }

    .t-arrow {
      flex-shrink: 0;
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--surface-2);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      transition: background .2s, color .2s;
    }
    .topic-card:hover .t-arrow { background: var(--accent, var(--teal)); color: #fff; }
    .t-arrow svg { width: 16px; height: 16px; }

    /* ── FOOTER ─────────────────────────────────────────── */
    .foot {
      margin-top: 42px;
      text-align: center;
      font-size: .62rem;
      font-weight: 600;
      letter-spacing: .2em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 30px;
      padding: 11px 20px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: .8rem;
      font-weight: 700;
      text-decoration: none;
      transition: border-color .18s, transform .12s;
    }
    .back-wrap { display: flex; justify-content: center; }
    .back-link:hover { border-color: var(--teal); }
    .back-link:active { transform: scale(.97); }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="eyebrow">TOEFL ITP · STRUCTURE</div>

    <h1 class="head-title">Temas de <em>estructura</em>,<br>parte&nbsp;2</h1>

    <p class="head-sub">Del tema 17 al 31: cláusulas, frases y reglas clave de <strong>Structure &amp; Written Expression</strong> para seguir avanzando con orden y claridad.</p>

    <div class="head-count"><span class="count-chip">15 temas · continuación</span></div>

    <div class="topic-list" id="topicList"></div>

    <div class="back-wrap">
      <a class="back-link" href="index.html">← Volver al inicio</a>
    </div>

    <div class="foot">TOEFL ITP · Structure &amp; Written Expression</div>

  </div>

  <script>
    /* ── Íconos de línea (SVG, heredan el color de acento) ── */
    const ICONS = {
      brackets: '<path d="M7 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h2"/><path d="M17 4h2a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-2"/>',
      tag: '<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>',
      link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
      equals: '<line x1="5" y1="9" x2="19" y2="9"/><line x1="5" y1="15" x2="19" y2="15"/>',
      clock: '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>',
      box: '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><line x1="12" y1="13" x2="12" y2="21"/>',
      pin: '<path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
      sort: '<path d="M7 4v16"/><polyline points="3 8 7 4 11 8"/><path d="M17 20V4"/><polyline points="13 16 17 20 21 16"/>',
      bolt: '<polygon points="13 2 4 14 12 14 11 22 20 10 12 10 13 2"/>',
      loop: '<path d="M4 12a8 8 0 0 1 8-8 8 8 0 0 1 8 8"/><polyline points="20 4 20 8 16 8"/><path d="M20 12a8 8 0 0 1-8 8 8 8 0 0 1-8-8"/><polyline points="4 20 4 16 8 16"/>',
      parallel: '<line x1="4" y1="16" x2="14" y2="6"/><line x1="10" y1="18" x2="20" y2="8"/>',
      move: '<polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/>',
      scale: '<line x1="12" y1="3" x2="12" y2="21"/><path d="M3 7h18"/><path d="M6 7l-3 6a3 3 0 0 0 6 0z"/><path d="M18 7l-3 6a3 3 0 0 0 6 0z"/>',
      merge: '<path d="M6 3v6a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"/><line x1="12" y1="15" x2="12" y2="21"/>',
      no: '<circle cx="12" cy="12" r="9"/><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"/>'
    };

    /* ── Colores de acento (todos de la paleta del index) ── */
    const ACCENTS = [
      { c: 'var(--teal)',   s: 'rgba(18,165,148,.14)'  },
      { c: 'var(--coral)',  s: 'rgba(255,122,92,.15)'  },
      { c: 'var(--amber)',  s: 'rgba(246,178,75,.18)'  },
      { c: 'var(--blue)',   s: 'rgba(47,182,198,.15)'  },
      { c: 'var(--teal-d)', s: 'rgba(10,116,104,.14)'  }
    ];

    /* ── Temas 17–31 ── */
    const TOPICS = [
      { n: 17, en: 'Independent Clauses',   es: 'Cláusulas independientes', ic: 'brackets', desc: 'Oraciones completas que se sostienen solas: tienen sujeto y verbo y expresan una idea entera.' },
      { n: 18, en: 'Adjective Clauses',     es: 'Cláusulas adjetivas',      ic: 'tag',      desc: 'Describen a un sustantivo con who, which, that y otros relativos para dar más información.' },
      { n: 19, en: 'Participial Phrases',   es: 'Frases participiales',     ic: 'link',     desc: 'Usan participios (-ing / -ed) para modificar y añadir detalle sin crear otra oración.' },
      { n: 20, en: 'Appositives',           es: 'Aposiciones',              ic: 'equals',   desc: 'Renombran o explican un sustantivo colocándose justo a su lado, entre comas.' },
      { n: 21, en: 'Adverb Clauses',        es: 'Cláusulas adverbiales',    ic: 'clock',    desc: 'Indican tiempo, causa, condición o contraste con when, because, if, although…' },
      { n: 22, en: 'Noun Clauses',          es: 'Cláusulas nominales',      ic: 'box',      desc: 'Cumplen la función de un sustantivo dentro de la oración (sujeto u objeto).' },
      { n: 23, en: 'Prepositional Phrases', es: 'Frases preposicionales',   ic: 'pin',      desc: 'Preposición + objeto que aporta lugar, tiempo o dirección a la idea principal.' },
      { n: 24, en: 'Word Order',            es: 'Orden de palabras',        ic: 'sort',     desc: 'La posición correcta de sujeto, verbo y complementos según las reglas del inglés.' },
      { n: 25, en: 'Verb Problems',         es: 'Problemas con verbos',     ic: 'bolt',     desc: 'Concordancia, tiempo verbal y forma correcta: los errores más comunes del examen.' },
      { n: 26, en: 'Infinitive and Gerund', es: 'Infinitivo y gerundio',    ic: 'loop',     desc: 'Cuándo usar “to + verbo” y cuándo la forma en “-ing” según cada estructura.' },
      { n: 27, en: 'Parallel Structures',   es: 'Estructuras paralelas',    ic: 'parallel', desc: 'Mantener la misma forma gramatical en listas, series y comparaciones.' },
      { n: 28, en: 'Misplaced Modifiers',   es: 'Modificadores mal ubicados', ic: 'move',   desc: 'Colocar cada descripción junto a la palabra correcta para que la frase tenga sentido.' },
      { n: 29, en: 'Comparisons',           es: 'Comparaciones',            ic: 'scale',    desc: 'Comparativos y superlativos: more, -er, as… as, the most y sus formas irregulares.' },
      { n: 30, en: 'Conjunctions',          es: 'Conjunciones',             ic: 'merge',    desc: 'Palabras que unen ideas: and, but, or, so, although y las correlativas.' },
      { n: 31, en: 'Negative Words',        es: 'Palabras negativas',       ic: 'no',       desc: 'no, not, never, hardly y su efecto en el resto de la oración e inversión.' }
    ];

    const list = document.getElementById('topicList');
    list.innerHTML = TOPICS.map((t, i) => {
      const a = ACCENTS[i % ACCENTS.length];
      const file = 'structure' + t.n + '.html';
      return `
        <div class="topic-card" style="--accent:${a.c};--accent-soft:${a.s}"
             onclick="abrirTema('${file}')" role="button" tabindex="0">
          <span class="t-num">${t.n}</span>
          <div class="t-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[t.ic]}</svg></div>
          <div class="t-body">
            <h3>${t.en}</h3>
            <span class="t-desc"> — ${t.desc}</span>
            <span class="t-es">${t.es}</span>
          </div>
          <div class="t-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></div>
        </div>`;
    }).join('');

    function abrirTema(file) {
      // Abre la página del tema. Crea estos archivos (structure17.html … structure31.html)
      // o dime los nombres reales y los cambio.
      window.location.href = file;
    }

    // Accesibilidad: activar con Enter
    list.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('topic-card')) {
        e.preventDefault(); e.target.click();
      }
    });
  </script>
</body>
</html>
